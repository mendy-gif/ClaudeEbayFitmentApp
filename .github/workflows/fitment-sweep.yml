name: Fitment sweep

# Ongoing automation (docs/DESIGN.md sec 7-8): on a schedule, refresh the Shopify
# donor dump and push chassis-family fitment to every live eBay listing that isn't
# already done. After the first full sweep the ledger makes this cheap — only NEW
# listings get processed; everything ledgered is an instant skip.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   EBAY_CLIENT_ID, EBAY_CLIENT_SECRET, EBAY_REFRESH_TOKEN   (eBay auto-refresh)
#   SHOPIFY_STORE, SHOPIFY_TOKEN                             (donor dump refresh)
#
# The eBay access token is minted fresh each run from the refresh token, and again
# mid-run if it nears expiry — so a multi-hour sweep never dies at the 2-hour wall.

on:
  schedule:
    - cron: "0 7 * * *"          # daily 07:00 UTC (~03:00 ET) — quiet hours
  workflow_dispatch:             # allow manual runs from the Actions tab
    inputs:
      limit:
        description: "Max SKUs to process (blank = the nightly default below)"
        required: false
        default: ""

env:
  # Cap each unattended run. The ledger resumes, so a backlog is worked off over
  # several nights instead of one multi-hour unsupervised push -- and a bad night
  # costs one batch, not the whole store. Once caught up, nightly runs only see
  # NEW listings and finish well under this. Override per-run via the input above.
  NIGHTLY_LIMIT: "1500"

concurrency:                     # never let two sweeps overlap (they'd double-read)
  group: fitment-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 330         # under the 6h job ceiling
    permissions:
      contents: write            # commit the refreshed dump + ledger back
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check required secrets
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: |
          missing=""
          [ -z "$EBAY_CLIENT_ID" ]     && missing="$missing EBAY_CLIENT_ID"
          [ -z "$EBAY_CLIENT_SECRET" ] && missing="$missing EBAY_CLIENT_SECRET"
          [ -z "$EBAY_REFRESH_TOKEN" ] && missing="$missing EBAY_REFRESH_TOKEN"
          if [ -n "$missing" ]; then
            echo "Missing required repository secret(s):$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Add them under Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "Values come from ebay_auth.json on the Mac (client_id, client_secret, refresh_token)." >> "$GITHUB_STEP_SUMMARY"
            echo "Missing required secret(s):$missing"
            exit 1
          fi
          echo "eBay secrets present."

      - name: Self-test (offline) -- never push live on broken logic
        run: python3 scripts/selftest.py

      # Optional. The donor dump is committed, so the sweep works without Shopify creds --
      # it just won't pick up SKUs added since the dump was last refreshed. Only the eBay
      # secrets are actually required to run.
      - name: Refresh Shopify donor dump (skipped if no Shopify secrets)
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          # Either a static SHOPIFY_TOKEN, or client id/secret which the script exchanges
          # for a 24h token (legacy custom apps, and their permanent tokens, were closed
          # off on 2026-01-01). Without a donor refresh the sweep still runs -- it just
          # cannot see cars parted out since the committed dump.
          if [ -z "$SHOPIFY_STORE" ]; then
            echo "No SHOPIFY_STORE set -- using the committed donor dump as-is."
            exit 0
          fi
          if [ -z "$SHOPIFY_TOKEN" ] && { [ -z "$SHOPIFY_CLIENT_ID" ] || [ -z "$SHOPIFY_CLIENT_SECRET" ]; }; then
            echo "No Shopify credentials set -- using the committed donor dump as-is."
            exit 0
          fi
          # Best-effort: a Shopify outage or a scope problem must not cancel the eBay
          # sweep, which works fine on the committed dump. But it must be VISIBLE -- the
          # script leaves the existing dump untouched on any failure, so continuing is safe.
          if python3 scripts/shopify_donor.py --dump; then
            echo "Donor dump refreshed from Shopify." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: Shopify donor refresh FAILED -- swept using the committed dump," \
                 "so cars parted out recently were not included. See the step log." \
                 >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push fitment (live)
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          LIMIT="${LIMIT:-$NIGHTLY_LIMIT}"
          python3 scripts/ebay_batch.py apply --from-shopify --from-inventory --live \
            --partnumber-fitment spreadsheet-fitment/data/built/ebay_ready_fitment.csv \
            --limit "$LIMIT"

      # The whole point. A push returning HTTP 200 proves nothing -- eBay stores a row
      # with an unrecognised trim and silently omits it from the listing, which is how
      # months of "successful" sweeps displayed nothing (docs/DESIGN.md sec 5.5). Verify
      # what the listings actually SHOW, and fail the job if it regresses.
      - name: Verify the fitment actually displays
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: |
          # pipefail is NOT on by default in Actions' bash, so `cmd | tee` would report
          # tee's exit status (always 0) and the --fail-under guard would never fire.
          set -o pipefail
          python3 scripts/ebay_display_audit.py --recent 300 --quiet \
            --fail-under 70 --csv data/display_audit.csv | tee audit.txt && rc=0 || rc=$?
          { echo '### Fitment display audit'; echo '```'; cat audit.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Commit updated dump + ledger
        if: always()          # a failed audit must still record what was pushed
        run: |
          git config user.name  "fitment-bot"
          git config user.email "fitment-bot@users.noreply.github.com"
          git add data/shopify_donors.json data/pushed_ledger.json data/batch_plan.csv \
                  data/ebay_compat_cache.json data/display_audit.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated fitment sweep: refresh dump + ledger [skip ci]"
          # A sweep runs for the best part of an hour. If anyone pushes to the branch in
          # that window the plain push is rejected and the run's entire record -- which
          # SKUs were pushed -- is thrown away with the runner. That happened on run #7.
          # Rebase onto whatever arrived and retry. These are append-mostly state files,
          # so a rebase is the right merge: keep their commits, replay ours on top.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "State committed (attempt $attempt)."
              exit 0
            fi
            echo "Push rejected -- someone else moved the branch. Rebasing and retrying."
            git fetch origin ${{ github.ref_name }}
            if ! git rebase FETCH_HEAD; then
              # Only our own state files are in play, so preferring the freshly-swept
              # version is correct; a conflict here must not lose the whole run.
              git checkout --ours data/ 2>/dev/null || true
              git add data/ 2>/dev/null || true
              git rebase --continue || git rebase --abort
            fi
            sleep $((attempt * 5))
          done
          echo "ERROR: could not push the sweep state after 5 attempts." >> "$GITHUB_STEP_SUMMARY"
          echo "The listings were updated on eBay but the ledger record was NOT saved," \
               "so those SKUs will be re-evaluated next run." >> "$GITHUB_STEP_SUMMARY"
          exit 1
