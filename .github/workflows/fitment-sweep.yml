name: Fitment sweep

# Ongoing automation (docs/DESIGN.md sec 7-8): on a schedule, refresh the Shopify
# donor dump and push chassis-family fitment to every live eBay listing that isn't
# already done. After the first full sweep the ledger makes this cheap — only NEW
# listings get processed; everything ledgered is an instant skip.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   EBAY_CLIENT_ID, EBAY_CLIENT_SECRET, EBAY_REFRESH_TOKEN   (eBay auto-refresh)
#   SHOPIFY_STORE, SHOPIFY_TOKEN                             (donor dump refresh)
#
# The eBay access token is minted fresh each run from the refresh token, and again
# mid-run if it nears expiry — so a multi-hour sweep never dies at the 2-hour wall.

on:
  # NO SCHEDULE HERE ANY MORE -- the nightly moved to mendy's Mac on 2026-08-28.
  # GitHub silently dropped the scheduled trigger on 2026-08-27 and again on 2026-08-28.
  # Both misses were confirmed the same way: eBay's GetItem counter still read ~0 hours
  # after the cron should have fired, so the job had not merely failed, it had never
  # started. Moving the minute off :30 (the most contended) did not help. Runs that
  # happen most nights are not automation.
  #
  # It now runs from launchd: ~/Library/LaunchAgents/com.mendy.fitment-sweep.plist
  # -> scripts/nightly_local.sh, 05:30 local, which is after eBay's 07:00 UTC quota
  # reset and clear of the Dismantly nightly on the same machine.
  #
  # This workflow is KEPT for manual runs. Its schedule is deliberately absent so the
  # two can never double-spend the 5,000/day GetItem quota or race the ledger commit.
  workflow_dispatch:             # allow manual runs from the Actions tab
    inputs:
      limit:
        description: "Max SKUs to process (blank = the nightly default below)"
        required: false
        default: ""

env:
  # Cap each unattended run. The ledger resumes, so a backlog is worked off over
  # several nights instead of one multi-hour unsupervised push -- and a bad night
  # costs one batch, not the whole store. Once caught up, nightly runs only see
  # NEW listings and finish well under this. Override per-run via the input above.
  #
  # Sized to eBay's daily Trading GetItem allowance (5,000), which is the scarce resource.
  # Raised from 700 once the sweep stopped spending that call on SKUs it could never push:
  # eBay carries ~22k SKUs but only ~8.4k have a donor, so the donor check now happens BEFORE
  # the guard read. Worst case 2000 guard reads + 300 audit + 250 drift = 2,550 of 5,000.
  NIGHTLY_LIMIT: "2000"

concurrency:                     # never let two sweeps overlap (they'd double-read)
  group: fitment-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 330         # under the 6h job ceiling
    permissions:
      contents: write            # commit the refreshed dump + ledger back
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          # Full history. The default (fetch-depth: 1) is a SHALLOW clone, and `git rebase`
          # against a freshly-fetched ref then dies with exit 128 -- which is exactly how
          # run #10 lost its work: the sweep and both audits passed, then the commit step
          # could not rebase onto a branch that had moved, and the whole run was discarded.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check required secrets
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: |
          missing=""
          [ -z "$EBAY_CLIENT_ID" ]     && missing="$missing EBAY_CLIENT_ID"
          [ -z "$EBAY_CLIENT_SECRET" ] && missing="$missing EBAY_CLIENT_SECRET"
          [ -z "$EBAY_REFRESH_TOKEN" ] && missing="$missing EBAY_REFRESH_TOKEN"
          if [ -n "$missing" ]; then
            echo "Missing required repository secret(s):$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Add them under Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "Values come from ebay_auth.json on the Mac (client_id, client_secret, refresh_token)." >> "$GITHUB_STEP_SUMMARY"
            echo "Missing required secret(s):$missing"
            exit 1
          fi
          echo "eBay secrets present."

      - name: Self-test (offline) -- never push live on broken logic
        run: python3 scripts/selftest.py

      # Optional. The donor dump is committed, so the sweep works without Shopify creds --
      # it just won't pick up SKUs added since the dump was last refreshed. Only the eBay
      # secrets are actually required to run.
      - name: Refresh Shopify donor dump (skipped if no Shopify secrets)
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          # Either a static SHOPIFY_TOKEN, or client id/secret which the script exchanges
          # for a 24h token (legacy custom apps, and their permanent tokens, were closed
          # off on 2026-01-01). Without a donor refresh the sweep still runs -- it just
          # cannot see cars parted out since the committed dump.
          if [ -z "$SHOPIFY_STORE" ]; then
            echo "No SHOPIFY_STORE set -- using the committed donor dump as-is."
            exit 0
          fi
          if [ -z "$SHOPIFY_TOKEN" ] && { [ -z "$SHOPIFY_CLIENT_ID" ] || [ -z "$SHOPIFY_CLIENT_SECRET" ]; }; then
            echo "No Shopify credentials set -- using the committed donor dump as-is."
            exit 0
          fi
          # Best-effort: a Shopify outage or a scope problem must not cancel the eBay
          # sweep, which works fine on the committed dump. But it must be VISIBLE -- the
          # script leaves the existing dump untouched on any failure, so continuing is safe.
          if python3 scripts/shopify_donor.py --dump; then
            echo "Donor dump refreshed from Shopify." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: Shopify donor refresh FAILED -- swept using the committed dump," \
                 "so cars parted out recently were not included. See the step log." \
                 >> "$GITHUB_STEP_SUMMARY"
            # Make it FAIL THE RUN at the end (see "Donor refresh health"). A warning in
            # the step summary is not enough: the refresh broke on 2026-08-21 and ran
            # stale for three nights before anyone noticed, because the run stayed green.
            echo "DONOR_REFRESH_FAILED=1" >> "$GITHUB_ENV"
          fi

      - name: Push fitment (live)
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          LIMIT="${LIMIT:-$NIGHTLY_LIMIT}"
          python3 scripts/ebay_batch.py apply --from-shopify --from-inventory --live \
            --partnumber-fitment spreadsheet-fitment/data/built/ebay_ready_fitment.csv \
            --etk-fitment data/etk_fitment.csv.gz \
            --limit "$LIMIT"

      # The whole point. A push returning HTTP 200 proves nothing -- eBay stores a row
      # with an unrecognised trim and silently omits it from the listing, which is how
      # months of "successful" sweeps displayed nothing (docs/DESIGN.md sec 5.5). Verify
      # what the listings actually SHOW, and fail the job if it regresses.
      - name: Verify the fitment actually displays
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: |
          # pipefail is NOT on by default in Actions' bash, so `cmd | tee` would report
          # tee's exit status (always 0) and the --fail-under guard would never fire.
          set -o pipefail
          python3 scripts/ebay_display_audit.py --recent 300 --quiet --learn \
            --fail-under 70 --csv data/display_audit.csv | tee audit.txt && rc=0 || rc=$?
          { echo '### Fitment display audit'; echo '```'; cat audit.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # Drift watch. Four systems write fitment to these listings -- Dismantly, PartOutPro,
      # eBay's own auto-fitment, and historically MyFitment -- so what we pushed can be
      # rewritten by any of them, silently. The step above only checks work from THIS run;
      # this one samples the whole ledger on a rotating offset so older listings get
      # revisited over time. Failing here emails whoever owns the repo.
      - name: Drift watch (has anything overwritten our fitment?)
        if: always()
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/ebay_display_audit.py --sample 250 --quiet --learn             --fail-on-leak --fail-under 60 --csv data/drift_audit.csv | tee drift.txt && rc=0 || rc=$?
          { echo '### Drift watch (older listings)'; echo '```'; cat drift.txt; echo '```'; }             >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -ne 0 ]; then
            echo "Fitment on previously-pushed listings no longer matches what we sent."                  >> "$GITHUB_STEP_SUMMARY"
            echo "Most likely another system rewrote it. See data/drift_audit.csv."                  >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      - name: Commit updated dump + ledger
        if: always()          # a failed audit must still record what was pushed
        run: |
          git config user.name  "fitment-bot"
          git config user.email "fitment-bot@users.noreply.github.com"
          # `git add <missing file>` aborts the whole step with exit 128. Several of these
          # only exist once a sweep has produced them -- skip_cache.json appears only after
          # a live push -- so naming them individually meant one absent file discarded the
          # entire run's state, including a donor refresh that had already succeeded. That
          # is how run #10 was lost. `git add -A data/` handles absent files.
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated fitment sweep: refresh dump + ledger [skip ci]"
          MINE=$(git rev-parse HEAD)          # this run's state, to restore on conflict
          # A sweep runs for the best part of an hour. If anyone pushes to the branch in
          # that window the plain push is rejected and the run's entire record -- which
          # SKUs were pushed -- is thrown away with the runner. That happened on run #7.
          # Rebase onto whatever arrived and retry. These are append-mostly state files,
          # so a rebase is the right merge: keep their commits, replay ours on top.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "State committed (attempt $attempt)."
              exit 0
            fi
            echo "Push rejected -- someone else moved the branch. Rebasing and retrying."
            git fetch origin ${{ github.ref_name }}
            if ! git -c core.editor=true rebase FETCH_HEAD; then
              # Restore data/ explicitly from THIS run's commit. --ours/--theirs invert
              # during a rebase, and the earlier version used --ours, which would have kept
              # the remote's stale files and thrown away the sweep we just did. Naming the
              # commit removes the ambiguity.
              git checkout "$MINE" -- data/ 2>/dev/null || true
              git add data/ 2>/dev/null || true
              git -c core.editor=true rebase --continue || git rebase --abort
            fi
            sleep $((attempt * 5))
          done
          echo "ERROR: could not push the sweep state after 5 attempts." >> "$GITHUB_STEP_SUMMARY"
          echo "The listings were updated on eBay but the ledger record was NOT saved," \
               "so those SKUs will be re-evaluated next run." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Runs LAST and only reports -- the sweep, the audits and the commit have all already
      # happened by now. Its whole job is to make a stale donor dump impossible to miss:
      # the eBay work is still valid, but it was done against yesterday's cars.
      - name: Donor refresh health
        if: always()
        run: |
          if [ "${DONOR_REFRESH_FAILED:-0}" = "1" ]; then
            echo "::error title=Donor dump is stale::The Shopify refresh failed, so this sweep ran against the committed dump. Cars parted out since it was written were invisible. The eBay pushes that DID happen are fine."
            exit 1
          fi
          echo "Donor dump refreshed normally."
